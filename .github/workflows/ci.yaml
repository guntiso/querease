name: Build and test
on:   [push]
env:
  # Re-check SNAPSHOT metadata even when the sbt cache is restored
  COURSIER_TTL: 0
jobs:
  Build-and-test:
    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:     [ubuntu-24.04]    # TODO macos-latest, windows-latest
        java:   [11] #, 17, 21]   # TODO
        scala:  ["2.12.21", "2.13.18", "3.3.8"]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: sbt
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Install language pack
      run: |
        sudo apt-get update
        sudo apt-get install language-pack-lv
    - name: Start PostgreSQL
      run: |
        sudo systemctl start postgresql.service
        pg_isready
    - name: Create user and databases
      run: |
        sudo -u postgres psql --command="CREATE ROLE querease LOGIN PASSWORD 'querease';"
        sudo -u postgres psql --command="CREATE DATABASE querease  with TEMPLATE template0 OWNER=querease LC_COLLATE='lv_LV.UTF-8' LC_CTYPE='lv_LV.UTF-8'"
        sudo -u postgres psql --command="CREATE DATABASE querease2 with TEMPLATE template0 OWNER=querease LC_COLLATE='lv_LV.UTF-8' LC_CTYPE='lv_LV.UTF-8'"
    - name: Configure tests
      run:  cp test/conf/application.conf.ci test/conf/application.conf
    - name: Compile and test and check version policy
      # sbt -Dhsqldb.method_class_names="test.HsqldbCustomFunctions.*" clean update +compile +test +versionPolicyCheck
      run: >
        sbt -Dhsqldb.method_class_names="test.HsqldbCustomFunctions.*"
        "++${{ matrix.scala }}"
        clean update compile
        test:compile test
        versionPolicyCheck
